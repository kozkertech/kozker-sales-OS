services:
  - type: web
    name: salesmind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: salesmind
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: govind.developer@kozker.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: EMERGENT_EMAIL_KEY
        sync: false
